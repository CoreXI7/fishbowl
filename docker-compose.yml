# Fishbowl. Put it behind your reverse proxy (HTTPS); it has its own sign-in, or use your SSO with AUTH: proxy.
# It publishes no ports.
# Setup: see README.md. Everything else is set on the dashboard's /settings page.
services:
  dash:
    container_name: dash
    # Pinned by digest so `docker compose up` never silently upgrades. To update: docker pull python:3.12-alpine, swap the digest.
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    command: ["python", "-u", "/app/app.py"]
    restart: unless-stopped
    mem_limit: 256m                 # a bug can never eat the host's RAM (it restarts instead)
    pids_limit: 128
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env                  # create it even if empty (cp .env.example .env); keys can go on the settings page instead
    environment:
      # Security-critical settings live here, never on the settings page:
      ORIGIN: ""                          # e.g. https://dash.example.com (CSRF guard); empty = the address it's opened on
      # AUTH: proxy                       # turn Fishbowl's own sign-in off: ONLY if your proxy's SSO (Authelia, Authentik, ...) protects it
      TRUSTED_PROXY: nginx                # your reverse proxy's container name; empty = no proxy (anyone who can reach port 8000 gets the sign-in page)
      NPM_DIR: /npm
      # SETTINGS_UI: "0"                  # make the settings page read-only
      # USER_HEADER: Remote-User          # name the SSO user in the log; ONLY if your proxy sets this header itself
      # LISTEN: "127.0.0.1 172.31.250.2"  # answer only on these addresses: see "Lock the dash to the proxy" in docs/SETTINGS.md
      # CHECK_VIA_PROXY: demo.example.com vault.example.com/alive # hosts on networks the dash can't reach: health-check them through the proxy (optional path instead of /). Also on the settings page (Services → Advanced); set here, it wins and locks that field
    volumes:
      - ./app:/app:ro
      - ./data:/data                  # settings + saved keys + uploads (must be writable by uid 1000)
      # Nginx Proxy Manager's proxy host configs (adjust the left side to your NPM data folder):
      - ../nginx/data/nginx/proxy_host:/npm:ro
      # Written by the optional root collector (see collector/). Remove both lines if you don't install it.
      - /var/lib/homelab-dash:/hw:ro
      - /var/lib/homelab-dash/req:/req
    # LAN-only use without a reverse proxy: uncomment, and set TRUSTED_PROXY: "" above.
    # ports: ["192.168.1.10:8000:8000"]   # your host's LAN address: a bare "8000:8000" also listens on every other interface, past ufw
    networks:
      - reverse_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s

networks:
  reverse_proxy:
    # The Docker network your reverse proxy is on.
    name: reverse_proxy
    external: true

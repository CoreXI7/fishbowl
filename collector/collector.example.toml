# homelab-dash collector config: /etc/homelab-dash/collector.toml
# Every key is optional; the defaults work on most Debian/Ubuntu boxes.

# Where hw.json is written (mount this folder read-only into the dash container at /hw).
# out_dir = "/var/lib/homelab-dash"

# UID the dash container runs as (owns the small request folder used by the cron "Looks good" button).
# dash_uid = 1000

# Network interface for the up/down rate. Default: the one with the default route.
# net_if = "eth0"

# Seconds between updates (SMART runs every 5 min, security checks every minute).
# interval = 5

# Mount points to show in the Drives panel (globs allowed). Default: "/", "/mnt/*", "/media/*/*", "/srv/*".
# Mounts listed here explicitly (no glob) show "NOT MOUNTED" if they disappear.
# mounts = ["/", "/mnt/disk1", "/mnt/disk2", "/mnt/parity"]
# mount_labels = { "/" = "boot SSD", "/mnt/parity" = "parity" }

# Set false to skip nvidia-smi even if it is installed.
# gpu = true

[security]
# fail2ban jail to report on ("" to skip).
fail2ban_jail = "sshd"
# systemd unit for SSH logins ("ssh" on Debian/Ubuntu also checks "sshd"; "" to skip).
ssh_unit = "ssh"
# Authelia container name, to count failed logins ("" to skip).
authelia_container = ""
# Flag known crypto-miner process names and show the top CPU users.
process_watch = true
# bad_process_names = ["xmrig", "minerd", "kinsing"]
# Flag any crontab change until you click "Looks good" on the dashboard.
cron_watch = true
# Show UFW / firewalld status.
firewall = true
# Files you locked with `chattr +i`; the dash goes red if a lock disappears.
# immutable_files = ["/opt/app/config.ini"]
# Detail views (click a box's title on the dash): written to sec-detail.json every minute. Set false to skip.
# details = true
# fail2ban's log, for the recent bans list.
# fail2ban_log = "/var/log/fail2ban.log"
# Authelia's SQLite database (opened read-only): sign-ins and lockouts in the Authelia details.
# authelia_db = "/srv/authelia/config/db.sqlite3"

# A watch script of your own that runs from cron, shown in the Process watch details.
# [security.watcher]
# label = "miner-watch.sh"
# heartbeat = "/var/lib/miner-watch/last-run"   # a file the script rewrites every run (its age = time since the last run)
# alerts = "/var/lib/miner-watch/alerted"       # one line per problem it has alerted on ("kind:detail")
# every_minutes = 5
# checks = ["known miner names", "programs running from /tmp", "connections to mining-pool ports"]
# kinds = { pool = "connection to a mining-pool port", tmp = "program running from /tmp" }   # labels for "kind:" prefixes

[backup]
# Your backup script's log. Lines starting with YYYY-MM-DD are grouped by the last day.
# log = "/var/log/backup.log"
# The last run is OK if success_regex matches (when set) and failure_regex does not.
# success_regex = "backup ok"
# failure_regex = "(?i)\\berror|failed\\b"
# Backups older than this many hours count as stale.
# max_age_hours = 26

# Extra rows checked against the last run's log lines: OK when the regex matches at least min_count lines.
# [[backup.checks]]
# label = "Offsite copies"
# regex = "offsite copy .* ok"
# min_count = 2

# Check that fresh backup files exist (newest file age, count, size).
# [[backup.artifacts]]
# label = "Nightly snapshot"
# glob = "/mnt/backup/snapshot-*.tar.gz"
#
# [[backup.artifacts]]
# label = "DB dumps"
# glob = "/srv/backups/db/*.sql.gz"

# Backup jobs for the Backups details: one block per job.
#   regex  = the log line that marks the job as done (the last match = its last success). Named groups
#            (?P<name>...), (?P<size>...) and (?P<took>...) are shown next to it.
#   files  = what it leaves behind (globs; a file named exactly that is missing gets flagged)
#   dest   = its destination folder: free space of that drive; size = true also measures the folder (du, once
#            after each backup run, at idle priority)
#   max_age_hours = overdue after this (default: max_age_hours above)
# [[backup.jobs]]
# label = "Nightly snapshot"
# regex = "snapshot done"
# dest = "/mnt/backup/snapshots"
# size = true
# every = "nightly at 03:00"
#
# [[backup.jobs]]
# label = "DB dumps"
# regex = "dumped (?P<name>\\S+) \\((?P<size>[^)]+)\\)"
# files = ["/srv/backups/db/*.sql.gz"]

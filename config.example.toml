# Fishbowl config: OPTIONAL. Almost everything here can be set on the dashboard's /settings page instead (not
# origin, npm_dir and trusted_proxy: they protect the dashboard, so they're set in docker-compose.yml, which wins).
# If you prefer a file: copy it to data/config.toml. It's used until the first save from the settings page.
# Secrets (passwords, API keys) do NOT go here: use the settings page or .env.

[site]
title = "my homelab"
tagline = "everything's running ✨"
tagline_down = "uh oh, something's down!"
# Public URL of the dashboard (CSRF guard). Only used if the ORIGIN variable isn't set at all: the example
# docker-compose.yml sets it (even empty), and that wins.
origin = "https://dash.example.com"
# Emoji that rains down when you click the title or the mascot.
click_emoji = "🫧"
# Optional mascot in the left column: upload it on the settings page (Themes), or put an image in app/static/ and point to it.
# mascot = "/static/mascot.png"
# mascot_credit = "art: your-artist"
# greeting = "Hi! Everything's up."
quotes = ["All systems go! 🚀", "Bubbles! 🫧", "Nothing on fire today 🔥🚫", "Backups are looking fresh ✨"]

[proxy]
# Folder with Nginx Proxy Manager's proxy_host/*.conf files, as mounted into the container.
npm_dir = "/npm"
# Only accept connections from this host (your reverse proxy's container name), so other
# containers on the network can't skip your SSO. Leave empty to allow everyone (e.g. LAN-only use).
trusted_proxy = "nginx"
# NPM hosts to leave off the dashboard.
skip_hosts = ["www.example.com"]
# Hosts to health-check through the proxy (on a network the dashboard isn't on); "host/path" checks that path.
# check_via_proxy = ["vault.example.com/alive"]

[security]
# IPs you trust. Prefixes end with a dot. SSH/SSO logins from anywhere else show up red.
known_ips = ["192.168.1."]   # not Docker's ranges (172.17-31.): a hairpinned or proxied visitor shows up from there

# ---------- optional integrations: each one turns on when its URL is set AND its secrets are saved (settings page or .env) ----------

[qbittorrent]
# url = "http://192.168.1.10:8080"
# Your real home WAN IP. If qBittorrent ever reports this as its external IP, the VPN leaked: big red banner.
# home_ip = "203.0.113.10"

[seerr]
# Overseerr, Jellyseerr and Seerr all work.
# url = "http://overseerr:5055"

[tautulli]
# Plex "Now Playing" comes from Tautulli.
# url = "http://tautulli:8181"

# ---------- services not in NPM (optional) ----------
# [[services]]
# name = "nas.lan"                 # shown name + link (https://<name>)
# url = "http://192.168.1.5:5000"  # what gets health-checked

# ---------- how service tiles are grouped and labelled ----------
# Anything not listed in a group lands in "New / other", so new NPM hosts are never hidden.

[[groups]]
name = "🎬 Media"
hosts = ["plex.example.com", "requests.example.com", "tautulli.example.com", "jellyfin.example.com", "immich.example.com", "komga.example.com"]

[[groups]]
name = "⬇ Downloads"
hosts = ["sonarr.example.com", "radarr.example.com", "prowlarr.example.com", "bazarr.example.com", "qbit.example.com"]

[[groups]]
name = "🧰 Apps"
hosts = ["vault.example.com", "paperless.example.com", "nextcloud.example.com", "home.example.com", "files.example.com"]

[[groups]]
name = "🛠 Admin"
hosts = ["proxy.example.com", "auth.example.com", "cockpit.example.com", "adguard.example.com", "portainer.example.com", "uptime.example.com"]

[[groups]]
name = "🌐 Websites"
hosts = ["example.com", "blog.example.com"]

# Label + icon per host. Icons are names from https://github.com/homarr-labs/dashboard-icons
# (e.g. "plex", "sonarr"), or a path like "/static/my-icon.svg". No icon = the site's own favicon.
# Optional: url = "..." to link somewhere other than https://<host>.
[apps]
